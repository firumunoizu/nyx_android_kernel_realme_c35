name: Build kernel (RMX3511)

on:
  workflow_dispatch:
    inputs:
      verity_no_reboot:
        description: "dm-verity: only log errors, do not reboot"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      DEFCONFIG: realme_c35_nyx_defconfig
      WANT_RELEASE: "5.4.254-android12-9-g0b4c88190d9d-ab1584"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev cpio lz4 zip xz-utils \
            python3 device-tree-compiler git curl gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Get toolchains
        run: |
          mkdir -p "$HOME/tc/clang"
          curl -fL --retry 3 -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz"
          tar -xzf clang.tar.gz -C "$HOME/tc/clang"
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 "$HOME/tc/gcc64"
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 "$HOME/tc/gcc32"
          echo "$HOME/tc/clang/bin" >> "$GITHUB_PATH"
          echo "$HOME/tc/gcc64/bin" >> "$GITHUB_PATH"
          echo "$HOME/tc/gcc32/bin" >> "$GITHUB_PATH"

      - name: Patch kernel
        run: |
          # make version match the stock kernel (modules in vendor_dlkm check it)
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 254/' Makefile
          if [ "${{ inputs.verity_no_reboot }}" = "true" ]; then
            grep -q 'kernel_restart("dm-verity device corrupted");' drivers/md/dm-verity-target.c
            sed -i 's/kernel_restart("dm-verity device corrupted");/DMERR("verity: corruption detected, reboot skipped");/' drivers/md/dm-verity-target.c
          fi

      - name: Configure
        run: |
          cat > args.sh <<'EOF'
          ARGS=(ARCH=arm64 O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf OBJSIZE=llvm-size STRIP=llvm-strip LDGOLD=aarch64-linux-gnu-ld.gold LLVM_AR=llvm-ar LLVM_DIS=llvm-dis BSP_BUILD_ANDROID_OS=y BSP_BUILD_FAMILY=qogirl6)
          EOF
          source args.sh
          export KBUILD_BUILD_USER=nyx KBUILD_BUILD_HOST=nyx-buildbot
          make "${ARGS[@]}" "$DEFCONFIG"
          scripts/config --file out/.config -d CFI_CLANG -d CFI_CLANG_SHADOW -d LOCALVERSION_AUTO \
            --set-str LOCALVERSION "-android12-9-g0b4c88190d9d-ab1584"
          make "${ARGS[@]}" olddefconfig
          REL="$(make "${ARGS[@]}" -s kernelrelease)"
          echo "kernelrelease: $REL"
          test "$REL" = "$WANT_RELEASE"

      - name: Build
        run: |
          source args.sh
          export KBUILD_BUILD_USER=nyx KBUILD_BUILD_HOST=nyx-buildbot
          make "${ARGS[@]}" -j"$(nproc)" 2>&1 | tee build.log
          test -f out/arch/arm64/boot/Image

      - name: Repack boot.img (if build/boot/boot.img exists)
        run: |
          if [ -f build/boot/boot.img ]; then
            chmod +x build/bin/magiskboot
            mkdir -p tmp/unp && cd tmp/unp
            "$GITHUB_WORKSPACE/build/bin/magiskboot" unpack "$GITHUB_WORKSPACE/build/boot/boot.img"
            cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" ./kernel
            "$GITHUB_WORKSPACE/build/bin/magiskboot" repack "$GITHUB_WORKSPACE/build/boot/boot.img"
            mkdir -p "$GITHUB_WORKSPACE/artifacts"
            mv new-boot.img "$GITHUB_WORKSPACE/artifacts/boot_new.img"
          else
            echo "build/boot/boot.img not found, skipping repack"
          fi

      - name: Collect
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/Image
          cp out/include/config/kernel.release artifacts/kernel.release
          cp build.log artifacts/build.log
          sha256sum artifacts/* | tee artifacts/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-rmx3511
          path: artifacts/*
          retention-days: 14
